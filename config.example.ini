# Copy to config.ini (install.sh does this for you) and edit.
# config.ini is not tracked by git, so tokens stay on the Pi.
# After editing:  sudo systemctl restart bme-tracker

[tracker]
# Shown on the dashboard and sent to InfluxDB as the `location` tag.
# Defaults to the Pi's hostname. Give each Pi a different name.
;name = living-room
# C or F. Sets the dashboard's default unit and what InfluxDB receives:
# C writes a `temp_c` field, F writes `temp_f`. (The local database is always C.)
;temperature_unit = F
;port = 8680
;db = /home/pi/bme-tracker/readings.db

[sensor]
# auto detects a BME680 or BME280 at 0x77 or 0x76.
type = auto
address = auto
# Degrees C added to every temperature reading. The sensors warm themselves
# and sit near the Pi, so this is usually negative (e.g. -2.0).
temp_offset = 0
# Seconds between reads; stored rows are one-minute averages.
sample_every = 5

# Uncomment ONE of the two blocks below to push readings to InfluxDB.

# --- InfluxDB 2.x / 3.x ---
;[influxdb]
;url = http://192.168.1.10:8086
;org = home
;bucket = sensors
;token = paste-a-write-token-here

# --- InfluxDB 1.x ---
;[influxdb]
;url = http://192.168.1.10:8086
;database = sensors
;username =
;password =

# Optional, either version (default: environment)
;measurement = environment
